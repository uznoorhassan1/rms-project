<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Billing · Restaurant Manager</title><link rel="stylesheet" href="style.css"></head><body>
<!-- Owner: Member 4 -->
<main><section id="billing" class="on"><h2>Billing</h2><p class="sub">Bill for table T4</p>
